<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">Network security zones</title>
  <desc id="desc">A simplified network showing the internet, firewall, controlled zone, internal network, proxy, VPN users, and servers.</desc>
  <rect width="980" height="360" fill="#fbfcfe"/>
  <text x="42" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">Network security zones</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Segment networks so untrusted traffic does not receive direct access to sensitive systems.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#49566b"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif">
    <rect x="42" y="132" width="150" height="86" rx="10" fill="#e7f5ff" stroke="#1c7ed6"/>
    <text x="117" y="166" text-anchor="middle" font-size="17" font-weight="700" fill="#184b7a">Internet</text>
    <text x="117" y="192" text-anchor="middle" font-size="13" fill="#184b7a">uncontrolled zone</text>
    <line x1="202" y1="175" x2="272" y2="175" stroke="#49566b" stroke-width="2.4" marker-end="url(#arrow)"/>
    <rect x="282" y="122" width="128" height="106" rx="10" fill="#ffe3e3" stroke="#e03131"/>
    <text x="346" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#8f1d1d">Firewall</text>
    <text x="346" y="186" text-anchor="middle" font-size="13" fill="#8f1d1d">rules and ports</text>
    <line x1="420" y1="175" x2="490" y2="175" stroke="#49566b" stroke-width="2.4" marker-end="url(#arrow)"/>
    <rect x="500" y="112" width="170" height="126" rx="10" fill="#fff3bf" stroke="#f08c00"/>
    <text x="585" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#8a4b00">Controlled zone</text>
    <text x="585" y="176" text-anchor="middle" font-size="13" fill="#8a4b00">proxy, WAF, VPN</text>
    <text x="585" y="198" text-anchor="middle" font-size="13" fill="#8a4b00">filtered access</text>
    <line x1="680" y1="175" x2="750" y2="175" stroke="#49566b" stroke-width="2.4" marker-end="url(#arrow)"/>
    <rect x="760" y="112" width="170" height="126" rx="10" fill="#ebfbee" stroke="#2f9e44"/>
    <text x="845" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#1b5e20">Internal zone</text>
    <text x="845" y="176" text-anchor="middle" font-size="13" fill="#1b5e20">servers, users, data</text>
    <text x="845" y="198" text-anchor="middle" font-size="13" fill="#1b5e20">least privilege</text>
    <path d="M165 270 C320 315, 640 315, 800 250" fill="none" stroke="#4c6ef5" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
    <text x="470" y="318" text-anchor="middle" font-size="14" fill="#364fc7">VPN tunnel: encrypted access over an untrusted network</text>
  </g>
</svg>
