<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">Packet analysis tool comparison</title>
  <desc id="desc">Comparison chart for Wireshark, tcpdump, and TShark.</desc>
  <style>
    .bg{fill:#f8fafc}
    .card{fill:#ffffff;stroke:#334155;stroke-width:2}
    .head1{fill:#dbeafe}
    .head2{fill:#dcfce7}
    .head3{fill:#fef3c7}
    .title{font:700 24px Arial, sans-serif;fill:#111827}
    .label{font:700 20px Arial, sans-serif;fill:#111827}
    .small{font:14px Arial, sans-serif;fill:#374151}
    .mono{font:700 15px Consolas, monospace;fill:#111827}
  </style>
  <rect class="bg" width="1040" height="500" rx="18" />
  <text class="title" x="520" y="44" text-anchor="middle">Packet Analysis Tools</text>
  <rect class="card" x="60" y="90" width="280" height="330" rx="14" />
  <rect class="head1" x="60" y="90" width="280" height="78" rx="14" />
  <text class="label" x="200" y="123" text-anchor="middle">Wireshark</text>
  <text class="small" x="200" y="147" text-anchor="middle">Graphical protocol analyzer</text>
  <text class="small" x="88" y="205">Best for:</text>
  <text class="small" x="88" y="232">- Learning packet details</text>
  <text class="small" x="88" y="256">- Visual filtering</text>
  <text class="small" x="88" y="280">- Following streams</text>
  <text class="small" x="88" y="325">Example filter:</text>
  <text class="mono" x="88" y="352">ip.addr == 172.21.224.2</text>
  <rect class="card" x="380" y="90" width="280" height="330" rx="14" />
  <rect class="head2" x="380" y="90" width="280" height="78" rx="14" />
  <text class="label" x="520" y="123" text-anchor="middle">tcpdump</text>
  <text class="small" x="520" y="147" text-anchor="middle">Lightweight command-line capture</text>
  <text class="small" x="408" y="205">Best for:</text>
  <text class="small" x="408" y="232">- Remote servers</text>
  <text class="small" x="408" y="256">- Quick terminal captures</text>
  <text class="small" x="408" y="280">- Writing PCAP files</text>
  <text class="small" x="408" y="325">Example command:</text>
  <text class="mono" x="408" y="352">tcpdump -r file.pcap -n</text>
  <rect class="card" x="700" y="90" width="280" height="330" rx="14" />
  <rect class="head3" x="700" y="90" width="280" height="78" rx="14" />
  <text class="label" x="840" y="123" text-anchor="middle">TShark</text>
  <text class="small" x="840" y="147" text-anchor="middle">CLI analysis with Wireshark engine</text>
  <text class="small" x="728" y="205">Best for:</text>
  <text class="small" x="728" y="232">- Automation</text>
  <text class="small" x="728" y="256">- Scripts and parsing</text>
  <text class="small" x="728" y="280">- Headless systems</text>
  <text class="small" x="728" y="325">Beginner idea:</text>
  <text class="small" x="728" y="350">Learn Wireshark filters first,</text>
  <text class="small" x="728" y="372">then automate repeated checks.</text>
</svg>
