<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Sneaker app PASTA data flow diagram</title>
  <desc id="desc">A beginner data flow diagram showing a user sending a sneaker search to a product search process, which queries a database and returns inventory listings.</desc>
  <rect width="960" height="420" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">PASTA data flow: sneaker product search</text>
  <text x="42" y="84" font-family="Arial, sans-serif" font-size="15" fill="#40516a">A simplified DFD helps analysts see where data enters, moves, and returns.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#49566b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g font-family="Arial, sans-serif" fill="#172033">
    <g transform="translate(58 158)" filter="url(#shadow)">
      <rect width="180" height="116" rx="12" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
      <circle cx="90" cy="38" r="20" fill="#ffffff" stroke="#1c7ed6" stroke-width="2"/>
      <path d="M60 92 C66 66,114 66,120 92" fill="none" stroke="#1c7ed6" stroke-width="6" stroke-linecap="round"/>
      <text x="90" y="108" text-anchor="middle" font-size="18" font-weight="700">User</text>
    </g>
    <g transform="translate(384 142)" filter="url(#shadow)">
      <rect width="210" height="148" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
      <text x="105" y="42" text-anchor="middle" font-size="18" font-weight="700">Product search</text>
      <text x="105" y="68" text-anchor="middle" font-size="18" font-weight="700">process</text>
      <line x1="48" y1="96" x2="162" y2="96" stroke="#2f9e44" stroke-width="4"/>
      <circle cx="60" cy="96" r="8" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
      <circle cx="105" cy="96" r="8" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
      <circle cx="150" cy="96" r="8" fill="#ffffff" stroke="#2f9e44" stroke-width="2"/>
      <text x="105" y="128" text-anchor="middle" font-size="13" fill="#40516a">Validates and queries</text>
    </g>
    <g transform="translate(736 154)" filter="url(#shadow)">
      <path d="M0 28 C0 12,166 12,166 28 L166 116 C166 132,0 132,0 116 Z" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
      <ellipse cx="83" cy="28" rx="83" ry="22" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
      <text x="83" y="80" text-anchor="middle" font-size="20" font-weight="700">Database</text>
      <text x="83" y="104" text-anchor="middle" font-size="13" fill="#40516a">Current inventory</text>
    </g>
  </g>
  <line x1="248" y1="200" x2="374" y2="200" stroke="#49566b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="311" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172033">Search request</text>
  <text x="311" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#40516a">"Sneakers for sale"</text>
  <line x1="604" y1="200" x2="726" y2="200" stroke="#49566b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="665" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172033">Database query</text>
  <path d="M736 256 C632 338,350 338,238 256" fill="none" stroke="#49566b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="487" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172033">Listings of current inventory return to the user</text>
  <rect x="42" y="372" width="876" height="1" fill="#cbd5e1"/>
  <text x="42" y="398" font-family="Arial, sans-serif" font-size="13" fill="#40516a">Analyst focus: validate input, use prepared statements, restrict database permissions, log unusual searches, and protect traffic in transit.</text>
</svg>
