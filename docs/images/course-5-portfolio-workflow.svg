<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Course 5 worksheet to portfolio workflow</title>
  <desc id="desc">A five-step workflow showing how a beginner can turn a cybersecurity worksheet into a portfolio-ready artifact.</desc>
  <rect width="960" height="360" fill="#f8fafc"/>
  <text x="42" y="54" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">From worksheet to portfolio artifact</text>
  <text x="42" y="84" font-family="Arial, sans-serif" font-size="15" fill="#40516a">Use the same thinking pattern for asset inventories, risk registers, access reviews, data leaks, USB scenarios, and PASTA.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#49566b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#94a3b8" flood-opacity="0.32"/>
    </filter>
  </defs>
  <g font-family="Arial, sans-serif" fill="#172033">
    <g transform="translate(42 132)" filter="url(#shadow)">
      <rect width="150" height="106" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
      <text x="75" y="32" text-anchor="middle" font-size="15" font-weight="700">1. Scenario</text>
      <text x="75" y="58" text-anchor="middle" font-size="13">What happened?</text>
      <text x="75" y="78" text-anchor="middle" font-size="13">What system or</text>
      <text x="75" y="96" text-anchor="middle" font-size="13">asset is involved?</text>
    </g>
    <line x1="200" y1="185" x2="238" y2="185" stroke="#49566b" stroke-width="2.4" marker-end="url(#arrow)"/>
    <g transform="translate(248 132)" filter="url(#shadow)">
      <rect width="150" height="106" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
      <text x="75" y="32" text-anchor="middle" font-size="15" font-weight="700">2. Evidence</text>
      <text x="75" y="58" text-anchor="middle" font-size="13">Which field, row,</text>
      <text x="75" y="78" text-anchor="middle" font-size="13">log, or detail proves</text>
      <text x="75" y="96" text-anchor="middle" font-size="13">the finding?</text>
    </g>
    <line x1="406" y1="185" x2="444" y2="185" stroke="#49566b" stroke-width="2.4" marker-end="url(#arrow)"/>
    <g transform="translate(454 132)" filter="url(#shadow)">
      <rect width="150" height="106" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
      <text x="75" y="32" text-anchor="middle" font-size="15" font-weight="700">3. Issue</text>
      <text x="75" y="58" text-anchor="middle" font-size="13">Which weakness,</text>
      <text x="75" y="78" text-anchor="middle" font-size="13">threat, or missing</text>
      <text x="75" y="96" text-anchor="middle" font-size="13">control matters?</text>
    </g>
    <line x1="612" y1="185" x2="650" y2="185" stroke="#49566b" stroke-width="2.4" marker-end="url(#arrow)"/>
    <g transform="translate(660 132)" filter="url(#shadow)">
      <rect width="150" height="106" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>
      <text x="75" y="32" text-anchor="middle" font-size="15" font-weight="700">4. Control</text>
      <text x="75" y="58" text-anchor="middle" font-size="13">Which technical,</text>
      <text x="75" y="78" text-anchor="middle" font-size="13">operational, or</text>
      <text x="75" y="96" text-anchor="middle" font-size="13">managerial fix?</text>
    </g>
    <line x1="818" y1="185" x2="856" y2="185" stroke="#49566b" stroke-width="2.4" marker-end="url(#arrow)"/>
    <g transform="translate(866 132)" filter="url(#shadow)">
      <rect width="72" height="106" rx="10" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
      <text x="36" y="30" text-anchor="middle" font-size="15" font-weight="700">5.</text>
      <text x="36" y="52" text-anchor="middle" font-size="13">Why</text>
      <text x="36" y="72" text-anchor="middle" font-size="13">it</text>
      <text x="36" y="92" text-anchor="middle" font-size="13">helps</text>
    </g>
  </g>
  <rect x="42" y="284" width="876" height="1" fill="#cbd5e1"/>
  <text x="42" y="314" font-family="Arial, sans-serif" font-size="14" fill="#172033">Final artifact sentence:</text>
  <text x="178" y="314" font-family="Arial, sans-serif" font-size="14" fill="#40516a">Because [evidence] shows [issue], I recommend [control] to reduce [risk or impact].</text>
</svg>
