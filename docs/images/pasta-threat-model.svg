<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">PASTA threat modeling stages</title>
  <desc id="desc">Seven PASTA threat modeling stages arranged from objectives through risk analysis and impact.</desc>
  <rect width="960" height="360" fill="#f8fafc"/>
  <text x="42" y="52" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#172033">PASTA threat modeling flow</text>
  <text x="42" y="82" font-family="Arial, sans-serif" font-size="15" fill="#40516a">PASTA connects business objectives, technical scope, evidence of threats, and practical risk decisions.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#49566b"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="13" fill="#172033">
    <g transform="translate(44 125)">
      <rect width="112" height="78" rx="8" fill="#e7f5ff" stroke="#1c7ed6"/>
      <text x="56" y="30" text-anchor="middle" font-weight="700">I</text>
      <text x="56" y="52" text-anchor="middle">Objectives</text>
    </g>
    <line x1="162" y1="164" x2="198" y2="164" stroke="#49566b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g transform="translate(206 125)">
      <rect width="112" height="78" rx="8" fill="#ebfbee" stroke="#2f9e44"/>
      <text x="56" y="30" text-anchor="middle" font-weight="700">II</text>
      <text x="56" y="52" text-anchor="middle">Scope</text>
    </g>
    <line x1="324" y1="164" x2="360" y2="164" stroke="#49566b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g transform="translate(368 125)">
      <rect width="112" height="78" rx="8" fill="#fff3bf" stroke="#f08c00"/>
      <text x="56" y="30" text-anchor="middle" font-weight="700">III</text>
      <text x="56" y="52" text-anchor="middle">Decompose</text>
    </g>
    <line x1="486" y1="164" x2="522" y2="164" stroke="#49566b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g transform="translate(530 125)">
      <rect width="112" height="78" rx="8" fill="#f3e8ff" stroke="#8b5cf6"/>
      <text x="56" y="30" text-anchor="middle" font-weight="700">IV</text>
      <text x="56" y="52" text-anchor="middle">Threats</text>
    </g>
    <line x1="648" y1="164" x2="684" y2="164" stroke="#49566b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g transform="translate(692 125)">
      <rect width="112" height="78" rx="8" fill="#ffe3e3" stroke="#e03131"/>
      <text x="56" y="30" text-anchor="middle" font-weight="700">V</text>
      <text x="56" y="52" text-anchor="middle">Vulnerabilities</text>
    </g>
    <line x1="804" y1="164" x2="840" y2="164" stroke="#49566b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g transform="translate(848 125)">
      <rect width="90" height="78" rx="8" fill="#e6fcf5" stroke="#099268"/>
      <text x="45" y="30" text-anchor="middle" font-weight="700">VI</text>
      <text x="45" y="52" text-anchor="middle">Attacks</text>
    </g>
    <line x1="893" y1="205" x2="893" y2="245" stroke="#49566b" stroke-width="2.2" marker-end="url(#arrow)"/>
    <g transform="translate(728 252)">
      <rect width="210" height="58" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
      <text x="105" y="24" text-anchor="middle" font-weight="700">VII</text>
      <text x="105" y="44" text-anchor="middle">Risk analysis and impact</text>
    </g>
  </g>
</svg>
