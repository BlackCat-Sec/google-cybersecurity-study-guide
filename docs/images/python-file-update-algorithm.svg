<svg xmlns="http://www.w3.org/2000/svg" width="980" height="720" viewBox="0 0 980 720" role="img" aria-labelledby="title desc">
  <title id="title">Python file update algorithm</title>
  <desc id="desc">Flowchart for opening an allow list, reading it, splitting into a list, removing unwanted IP addresses, joining the list, and writing the file.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .step{fill:#ffffff;stroke:#334155;stroke-width:2}
      .decision{fill:#fef3c7;stroke:#a16207;stroke-width:2}
      .title{font:700 24px Arial, sans-serif;fill:#111827}
      .label{font:700 16px Arial, sans-serif;fill:#111827}
      .small{font:14px Arial, sans-serif;fill:#374151}
      .arrow{stroke:#1f2937;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="980" height="720" rx="18" />
  <text class="title" x="490" y="44" text-anchor="middle">Allow-List File Update Algorithm</text>
  <rect class="step" x="345" y="80" width="290" height="70" rx="12" />
  <text class="label" x="490" y="110" text-anchor="middle">Open allow-list file</text>
  <text class="small" x="490" y="132" text-anchor="middle">with open(file, "r")</text>
  <rect class="step" x="345" y="180" width="290" height="70" rx="12" />
  <text class="label" x="490" y="210" text-anchor="middle">Read file contents</text>
  <text class="small" x="490" y="232" text-anchor="middle">file.read()</text>
  <rect class="step" x="345" y="280" width="290" height="70" rx="12" />
  <text class="label" x="490" y="310" text-anchor="middle">Convert string to list</text>
  <text class="small" x="490" y="332" text-anchor="middle">ip_addresses.split()</text>
  <polygon class="decision" points="490,385 665,465 490,545 315,465" />
  <text class="label" x="490" y="454" text-anchor="middle">Remove-list item</text>
  <text class="label" x="490" y="476" text-anchor="middle">in allow list?</text>
  <rect class="step" x="80" y="430" width="205" height="70" rx="12" />
  <text class="label" x="182" y="460" text-anchor="middle">Remove IP</text>
  <text class="small" x="182" y="482" text-anchor="middle">list.remove(item)</text>
  <rect class="step" x="700" y="430" width="205" height="70" rx="12" />
  <text class="label" x="802" y="460" text-anchor="middle">Skip safely</text>
  <text class="small" x="802" y="482" text-anchor="middle">avoid remove error</text>
  <rect class="step" x="345" y="575" width="290" height="70" rx="12" />
  <text class="label" x="490" y="605" text-anchor="middle">Join and write file</text>
  <text class="small" x="490" y="627" text-anchor="middle">"\n".join(list), open(file, "w")</text>
  <path class="arrow" d="M490 150 L490 170" />
  <path class="arrow" d="M490 250 L490 270" />
  <path class="arrow" d="M490 350 L490 380" />
  <path class="arrow" d="M315 465 L295 465" />
  <path class="arrow" d="M665 465 L690 465" />
  <path class="arrow" d="M182 500 C210 558 310 610 335 610" />
  <path class="arrow" d="M802 500 C760 558 660 610 645 610" />
  <text class="small" x="298" y="440" text-anchor="middle">Yes</text>
  <text class="small" x="682" y="440" text-anchor="middle">No</text>
</svg>
