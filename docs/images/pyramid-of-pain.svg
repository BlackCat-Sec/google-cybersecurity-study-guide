<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
  <title id="title">Pyramid of Pain for threat indicators</title>
  <desc id="desc">Pyramid showing hash values as easiest for attackers to change and tactics techniques and procedures as hardest.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .title{font:700 24px Arial, sans-serif;fill:#111827}
      .label{font:700 17px Arial, sans-serif;fill:#111827}
      .small{font:13px Arial, sans-serif;fill:#374151}
      .arrow{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="900" height="640" rx="18" />
  <text class="title" x="450" y="45" text-anchor="middle">Pyramid of Pain</text>
  <text class="small" x="450" y="73" text-anchor="middle">Higher indicators are harder for attackers to replace after defenders detect them.</text>
  <polygon points="450,95 255,205 645,205" fill="#fee2e2" stroke="#991b1b" stroke-width="2" />
  <polygon points="255,215 205,295 695,295 645,215" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <polygon points="205,305 155,385 745,385 695,305" fill="#fef3c7" stroke="#a16207" stroke-width="2" />
  <polygon points="155,395 105,475 795,475 745,395" fill="#dcfce7" stroke="#166534" stroke-width="2" />
  <polygon points="105,485 55,565 845,565 795,485" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2" />
  <text class="label" x="450" y="166" text-anchor="middle">TTPs</text>
  <text class="small" x="450" y="188" text-anchor="middle">Example: input capture, command and control, phishing workflow</text>
  <text class="label" x="450" y="255" text-anchor="middle">Tools</text>
  <text class="small" x="450" y="276" text-anchor="middle">Malware families, scripts, attack utilities</text>
  <text class="label" x="450" y="344" text-anchor="middle">Network and host artifacts</text>
  <text class="small" x="450" y="365" text-anchor="middle">URIs, user agents, files, registry keys, services</text>
  <text class="label" x="450" y="434" text-anchor="middle">Domain names and IP addresses</text>
  <text class="small" x="450" y="455" text-anchor="middle">Infrastructure indicators defenders can block or search</text>
  <text class="label" x="450" y="524" text-anchor="middle">Hash values</text>
  <text class="small" x="450" y="545" text-anchor="middle">Easy for attackers to change by modifying the file</text>
  <path class="arrow" d="M812 560 L812 120" />
  <text class="small" x="820" y="350" transform="rotate(-90 820,350)" text-anchor="middle">More painful for the attacker</text>
</svg>
