<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">Incident response lifecycle</title>
  <desc id="desc">Four phase incident response lifecycle showing preparation, detection and analysis, containment eradication and recovery, and post-incident activity.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .card{fill:#ffffff;stroke:#334155;stroke-width:2}
      .prep{fill:#dbeafe}
      .detect{fill:#dcfce7}
      .contain{fill:#fef3c7}
      .post{fill:#fce7f3}
      .title{font:700 24px Arial, sans-serif;fill:#111827}
      .label{font:700 18px Arial, sans-serif;fill:#111827}
      .text{font:14px Arial, sans-serif;fill:#374151}
      .arrow{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .loop{stroke:#475569;stroke-width:2.5;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="980" height="520" rx="18" />
  <text class="title" x="490" y="48" text-anchor="middle">Incident Response Lifecycle</text>
  <rect class="card prep" x="65" y="110" width="230" height="125" rx="14" />
  <text class="label" x="180" y="146" text-anchor="middle">1. Preparation</text>
  <text class="text" x="90" y="177">Playbooks, contacts, logging,</text>
  <text class="text" x="90" y="199">training, roles, and tooling</text>
  <rect class="card detect" x="375" y="110" width="230" height="125" rx="14" />
  <text class="label" x="490" y="146" text-anchor="middle">2. Detect and Analyze</text>
  <text class="text" x="400" y="177">Validate alerts, collect evidence,</text>
  <text class="text" x="400" y="199">scope impact, assign severity</text>
  <rect class="card contain" x="685" y="110" width="230" height="125" rx="14" />
  <text class="label" x="800" y="146" text-anchor="middle">3. Contain, Eradicate, Recover</text>
  <text class="text" x="710" y="177">Limit harm, remove cause,</text>
  <text class="text" x="710" y="199">restore and validate service</text>
  <rect class="card post" x="375" y="330" width="230" height="125" rx="14" />
  <text class="label" x="490" y="366" text-anchor="middle">4. Post-Incident Activity</text>
  <text class="text" x="400" y="397">Report, lessons learned,</text>
  <text class="text" x="400" y="419">detection tuning, control fixes</text>
  <path class="arrow" d="M295 172 L365 172" />
  <path class="arrow" d="M605 172 L675 172" />
  <path class="arrow" d="M800 246 C800 320 700 392 615 392" />
  <path class="loop" d="M365 392 C245 392 180 315 180 247" />
  <text class="text" x="238" y="388" text-anchor="middle">lessons improve preparation</text>
</svg>
