<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title desc">
  <title id="title">Python security automation workflow</title>
  <desc id="desc">Workflow showing how Python helps analysts collect input, parse data, apply logic, update output, and document results.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .card{fill:#ffffff;stroke:#334155;stroke-width:2}
      .one{fill:#dbeafe}
      .two{fill:#dcfce7}
      .three{fill:#fef3c7}
      .four{fill:#fee2e2}
      .five{fill:#fce7f3}
      .title{font:700 24px Arial, sans-serif;fill:#111827}
      .label{font:700 17px Arial, sans-serif;fill:#111827}
      .small{font:14px Arial, sans-serif;fill:#374151}
      .arrow{stroke:#1f2937;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1040" height="560" rx="18" />
  <text class="title" x="520" y="48" text-anchor="middle">Python for Security Automation</text>
  <rect class="card one" x="60" y="140" width="165" height="145" rx="14" />
  <text class="label" x="142" y="176" text-anchor="middle">1. Input</text>
  <text class="small" x="142" y="208" text-anchor="middle">Logs, files,</text>
  <text class="small" x="142" y="230" text-anchor="middle">lists, alerts,</text>
  <text class="small" x="142" y="252" text-anchor="middle">indicators</text>
  <rect class="card two" x="260" y="140" width="165" height="145" rx="14" />
  <text class="label" x="342" y="176" text-anchor="middle">2. Parse</text>
  <text class="small" x="342" y="208" text-anchor="middle">split, regex,</text>
  <text class="small" x="342" y="230" text-anchor="middle">lists, strings,</text>
  <text class="small" x="342" y="252" text-anchor="middle">fields</text>
  <rect class="card three" x="460" y="140" width="165" height="145" rx="14" />
  <text class="label" x="542" y="176" text-anchor="middle">3. Decide</text>
  <text class="small" x="542" y="208" text-anchor="middle">conditions,</text>
  <text class="small" x="542" y="230" text-anchor="middle">loops,</text>
  <text class="small" x="542" y="252" text-anchor="middle">functions</text>
  <rect class="card four" x="660" y="140" width="165" height="145" rx="14" />
  <text class="label" x="742" y="176" text-anchor="middle">4. Output</text>
  <text class="small" x="742" y="208" text-anchor="middle">print, write,</text>
  <text class="small" x="742" y="230" text-anchor="middle">append,</text>
  <text class="small" x="742" y="252" text-anchor="middle">report</text>
  <rect class="card five" x="860" y="140" width="125" height="145" rx="14" />
  <text class="label" x="922" y="176" text-anchor="middle">5. Review</text>
  <text class="small" x="922" y="208" text-anchor="middle">debug,</text>
  <text class="small" x="922" y="230" text-anchor="middle">comment,</text>
  <text class="small" x="922" y="252" text-anchor="middle">document</text>
  <path class="arrow" d="M225 213 L250 213" />
  <path class="arrow" d="M425 213 L450 213" />
  <path class="arrow" d="M625 213 L650 213" />
  <path class="arrow" d="M825 213 L850 213" />
  <rect class="card" x="150" y="365" width="740" height="95" rx="14" />
  <text class="label" x="520" y="399" text-anchor="middle">Analyst goal</text>
  <text class="small" x="520" y="428" text-anchor="middle">Automate repeatable work while keeping evidence, decisions, and code easy to explain.</text>
</svg>
