<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" role="img" aria-labelledby="title desc">
  <title id="title">Phishing playbook flow</title>
  <desc id="desc">Flowchart for receiving a phishing alert, evaluating evidence, checking links and attachments, escalating malicious cases, and closing non-malicious tickets.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1f2937" />
    </marker>
    <style>
      .bg{fill:#f8fafc}
      .step{fill:#ffffff;stroke:#334155;stroke-width:2}
      .decision{fill:#fff7ed;stroke:#c2410c;stroke-width:2}
      .close{fill:#dcfce7;stroke:#166534;stroke-width:2}
      .escalate{fill:#fee2e2;stroke:#991b1b;stroke-width:2}
      .title{font:700 24px Arial, sans-serif;fill:#111827}
      .label{font:700 15px Arial, sans-serif;fill:#111827}
      .small{font:13px Arial, sans-serif;fill:#374151}
      .arrow{stroke:#1f2937;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .yesno{font:700 13px Arial, sans-serif;fill:#111827}
    </style>
  </defs>
  <rect class="bg" x="0" y="0" width="1040" height="680" rx="18" />
  <text class="title" x="520" y="44" text-anchor="middle">Phishing Alert Triage Flow</text>
  <rect class="step" x="390" y="80" width="260" height="78" rx="12" />
  <text class="label" x="520" y="111" text-anchor="middle">1. Receive alert</text>
  <text class="small" x="520" y="135" text-anchor="middle">Open ticket and read details</text>
  <rect class="step" x="390" y="200" width="260" height="96" rx="12" />
  <text class="label" x="520" y="232" text-anchor="middle">2. Evaluate evidence</text>
  <text class="small" x="520" y="256" text-anchor="middle">Sender, recipient, subject, body,</text>
  <text class="small" x="520" y="276" text-anchor="middle">IP addresses, links, attachments</text>
  <polygon class="decision" points="520,342 680,422 520,502 360,422" />
  <text class="label" x="520" y="411" text-anchor="middle">Links or</text>
  <text class="label" x="520" y="432" text-anchor="middle">attachments?</text>
  <polygon class="decision" points="210,342 350,422 210,502 70,422" />
  <text class="label" x="210" y="411" text-anchor="middle">Malicious</text>
  <text class="label" x="210" y="432" text-anchor="middle">evidence?</text>
  <rect class="escalate" x="70" y="545" width="280" height="82" rx="12" />
  <text class="label" x="210" y="577" text-anchor="middle">Escalate ticket</text>
  <text class="small" x="210" y="601" text-anchor="middle">Summarize evidence and notify L2</text>
  <rect class="close" x="690" y="382" width="280" height="82" rx="12" />
  <text class="label" x="830" y="414" text-anchor="middle">Close ticket</text>
  <text class="small" x="830" y="438" text-anchor="middle">Explain why no malicious evidence</text>
  <path class="arrow" d="M520 158 L520 190" />
  <path class="arrow" d="M520 296 L520 335" />
  <path class="arrow" d="M360 422 L350 422" />
  <path class="arrow" d="M210 502 L210 535" />
  <path class="arrow" d="M680 423 L690 423" />
  <path class="arrow" d="M350 422 C470 422 585 423 690 423" />
  <text class="yesno" x="438" y="406" text-anchor="middle">Yes</text>
  <text class="yesno" x="720" y="405" text-anchor="middle">No</text>
  <text class="yesno" x="267" y="524" text-anchor="middle">Yes</text>
  <text class="yesno" x="455" y="454" text-anchor="middle">No</text>
  <text class="small" x="520" y="646" text-anchor="middle">Never open suspicious links or attachments on a normal workstation.</text>
</svg>
